<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alisilia — The website that saved 80% of my time online.</title>
<link rel="icon" type="image/png" href="/justlogo.png">
<script src="/vendor/alisilia-auth.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root{
    --ink:#0a0a0a;
    --paper:#ffffff;
    --paper-dim:#f6f6f4;
    --line:#e4e4e0;
    --mid:#8c8c88;
    --soft:#b9b9b4;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }

  html{ -webkit-font-smoothing:antialiased; }

  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter', sans-serif;
    overflow-x:hidden;
  }

  a, button{ font-family:inherit; }

  :focus-visible{
    outline:2px solid var(--ink);
    outline-offset:3px;
  }

  /* ---------- NAV ---------- */

  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:20px 32px;
    border-bottom:1px solid var(--line);
    position:relative;
    z-index:30;
    gap: 16px;
  }

  .brand{
    display:flex;
    align-items:center;
    gap:10px;
    flex-shrink: 0;
  }

  .brand img{
    width:22px;
    height:22px;
    object-fit:contain;
    filter:grayscale(1) contrast(1.15);
  }

  .brand span{
    font-family:'Space Grotesk', sans-serif;
    font-weight:600;
    font-size:18px;
    letter-spacing:-0.01em;
  }

  /* --- SEARCH BAR --- */
  .search-wrap {
    width: 300px;
    position: relative;
    flex-shrink: 1;
  }

  .search-input {
    width: 100%;
    padding: 9px 16px 9px 36px;
    border: 1px solid var(--line);
    border-radius: 999px;
    font-size: 14px;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }

  .search-input::placeholder {
    color: var(--mid);
  }

  .search-input:focus {
    outline: none;
    border-color: var(--ink);
    box-shadow: 0 1px 0 var(--ink);
  }

  .search-icon {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    width: 16px;
    height: 16px;
    color: var(--mid);
    pointer-events: none;
    flex-shrink: 0;
  }

  .search-results {
    position: absolute;
    top: calc(100% + 8px);
    left: 0;
    right: 0;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 12px;
    max-height: 480px;
    overflow-y: auto;
    z-index: 100;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
    display: none;
  }

  .search-results.show {
    display: block;
  }

  .search-result-item {
    padding: 12px 16px;
    border-bottom: 1px solid var(--line);
    cursor: pointer;
    text-decoration: none;
    color: inherit;
    display: flex;
    gap: 12px;
    align-items: flex-start;
    transition: background 0.12s ease;
  }

  .search-result-item:last-child {
    border-bottom: none;
  }

  .search-result-item:hover {
    background: var(--paper-dim);
  }

  .search-result-thumb {
    width: 56px;
    height: 32px;
    border-radius: 4px;
    object-fit: cover;
    flex-shrink: 0;
    background: var(--paper-dim);
  }

  .search-result-meta {
    flex: 1;
    min-width: 0;
  }

  .search-result-title {
    font-size: 13px;
    font-weight: 500;
    line-height: 1.35;
    color: var(--ink);
    overflow: hidden;
    text-overflow: ellipsis;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    margin-bottom: 4px;
  }

  .search-result-category {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--mid);
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }

  .search-empty {
    padding: 24px 16px;
    text-align: center;
    color: var(--mid);
    font-size: 13px;
  }

  .search-hashtags {
    padding: 8px;
    border-top: 1px solid var(--line);
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }

  .search-hashtag-chip {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    padding: 6px 10px;
    border-radius: 999px;
    background: var(--paper-dim);
    color: var(--mid);
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.12s ease, color 0.12s ease;
    text-transform: uppercase;
    letter-spacing: 0.02em;
  }

  .search-hashtag-chip:hover {
    background: var(--line);
    color: var(--ink);
  }

  .search-hashtag-chip.active {
    background: var(--ink);
    color: white;
  }

  .auth{
    display:flex;
    align-items:center;
    gap:10px;
    flex-shrink: 0;
    margin-left: auto;
  }

  .btn{
    font-family:'Inter', sans-serif;
    font-weight:500;
    font-size:14px;
    padding:9px 18px;
    border-radius:999px;
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    gap:8px;
    transition:transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
    white-space:nowrap;
  }

  .btn:active{ transform:translateY(1px) scale(0.98); }

  .btn-ghost{
    background:var(--paper);
    color:var(--ink);
    border:1px solid var(--line);
  }

  .btn-ghost:hover{
    border-color:var(--ink);
    box-shadow:0 1px 0 var(--ink);
  }

  .btn-solid{
    background:var(--ink);
    color:var(--paper);
    border:1px solid var(--ink);
  }

  .btn-solid:hover{
    box-shadow:0 4px 14px rgba(0,0,0,0.25);
  }

  .btn-solid svg{ width:14px; height:14px; flex-shrink:0; }

  .user-chip{
    font-family:'IBM Plex Mono', monospace;
    font-size:13px;
    letter-spacing:0.01em;
    color:var(--mid);
    padding:0 2px;
  }

  .icon-btn{
    width:36px;
    height:36px;
    border-radius:50%;
    border:1px solid var(--line);
    background:var(--paper);
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--ink);
    text-decoration:none;
    flex-shrink:0;
    transition:border-color 0.15s ease, box-shadow 0.15s ease, transform 0.15s ease;
  }

  .icon-btn:hover{ border-color:var(--ink); box-shadow:0 1px 0 var(--ink); }
  .icon-btn:active{ transform:translateY(1px) scale(0.96); }
  .icon-btn svg{ width:16px; height:16px; }

  .auth-skeleton{
    width:64px;
    height:36px;
    border-radius:999px;
    background:var(--paper-dim);
  }

  /* ---------- HERO ---------- */

  .hero{
    position:relative;
    height:300px;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  
  .hero-content {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    padding: 0 20px;
  }

  .hero-text {
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size:42px;
    letter-spacing:-0.02em;
    text-align:center;
  }
  
  .hero-subtitle {
    color: var(--mid);
    text-align: center;
    max-width: 650px;
    line-height: 1.5;
    font-size: 15px;
  }

  /* layered, mostly-faded watermark */
  .watermark{
    position:absolute;
    top:50%;
    left:50%;
    width:1100px;
    height:1100px;
    pointer-events:none;
    z-index:0;
  }

  .watermark img{
    position:absolute;
    top:50%;
    left:50%;
    filter:grayscale(1);
    object-fit:contain;
  }

  .watermark img:nth-child(1){
    width:680px;
    transform:translate(-50%,-50%) rotate(-6deg);
    opacity:0.035;
  }
  .watermark img:nth-child(2){
    width:430px;
    transform:translate(-65%,-45%) rotate(10deg);
    opacity:0.05;
  }
  .watermark img:nth-child(3){
    width:260px;
    transform:translate(-30%,-58%) rotate(-16deg);
    opacity:0.06;
  }

  /* ---------- SUBNAV (category bar) ---------- */

  .subnav{
    display:flex;
    align-items:center;
    gap:30px;
    padding:0 32px;
    height:46px;
    border-bottom:1px solid var(--line);
    position:relative;
    z-index:10;
    background:var(--paper);
    overflow-x:auto;
  }

  .subnav a{
    font-family:'IBM Plex Mono', monospace;
    font-size:12.5px;
    letter-spacing:0.04em;
    text-transform:uppercase;
    color:var(--mid);
    text-decoration:none;
    height:100%;
    display:flex;
    align-items:center;
    border-bottom:2px solid transparent;
    white-space:nowrap;
    transition:color 0.12s ease, border-bottom-color 0.12s ease;
  }

  .subnav a:hover{ color:var(--ink); }

  .subnav a.active{
    color:var(--ink);
    border-bottom-color:var(--ink);
  }

  /* ---------- FEED ---------- */

  .feed{
    max-width:1400px;
    margin:0 auto;
    padding:40px 32px 100px;
  }

  .feed-head{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:32px;
    gap:16px;
  }

  .feed-head h2{
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size:28px;
  }

  .feed-status{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:13px;
    color:var(--mid);
  }

  .dot{
    width:6px;
    height:6px;
    border-radius:50%;
    background:var(--mid);
    animation:pulse 2s ease-in-out infinite;
  }

  @keyframes pulse{
    0%, 100%{ opacity:1; }
    50%{ opacity:0.4; }
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(180px, 1fr));
    gap:20px;
  }

  .vcard{
    display:flex;
    flex-direction:column;
    gap:10px;
    text-decoration:none;
    color:inherit;
    transition:opacity 0.12s ease;
  }

  .vcard:hover{ opacity:0.75; }

  .vthumb-wrap{
    position:relative;
    width:100%;
    aspect-ratio:16/9;
    border-radius:10px;
    overflow:hidden;
    background:var(--paper-dim);
    border:1px solid var(--line);
  }

  .vthumb-wrap img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }

  .vrow{
    display:flex;
    gap:8px;
  }

  .vavatar{
    width:32px;
    height:32px;
    border-radius:50%;
    object-fit:cover;
    flex-shrink:0;
    background:var(--paper-dim);
  }

  .vmeta{
    flex:1;
    min-width:0;
    display:flex;
    flex-direction:column;
    gap:4px;
  }

  .vtitle{
    font-size:13px;
    font-weight:500;
    line-height:1.35;
    overflow:hidden;
    text-overflow:ellipsis;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
  }

  .vchannel{
    font-size:12px;
    color:var(--mid);
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }

  .vsub{
    font-size:11px;
    color:var(--soft);
  }

  .feed-empty, .feed-error{
    grid-column:1 / -1;
    padding:80px 40px;
    text-align:center;
    font-size:15px;
    color:var(--mid);
  }

  /* ---------- SKELETON STYLES ---------- */

  .card-sk{
    display:flex;
    flex-direction:column;
    gap:10px;
  }

  .thumb-sk{
    width:100%;
    aspect-ratio:16/9;
    border-radius:10px;
    background:var(--paper-dim);
    animation:shimmer 2.2s infinite;
  }

  .row-sk{
    display:flex;
    gap:8px;
  }

  .avatar-sk{
    width:32px;
    height:32px;
    border-radius:50%;
    background:var(--paper-dim);
    flex-shrink:0;
    animation:shimmer 2.2s infinite;
  }

  .lines-sk{
    flex:1;
    display:flex;
    flex-direction:column;
    gap:6px;
  }

  .line-sk{
    height:10px;
    border-radius:6px;
    background:var(--paper-dim);
    animation:shimmer 2.2s infinite;
  }

  .line-sk.w90{ width:92%; }
  .line-sk.w60{ width:58%; }
  .line-sk.w40{ width:42%; }

  @keyframes shimmer{
    0%{ opacity:1; }
    50%{ opacity:0.5; }
    100%{ opacity:1; }
  }

  /* ---------- FOOTER ---------- */

  footer{
    padding:40px 32px;
    border-top:1px solid var(--line);
    text-align:center;
    font-size:12px;
    color:var(--mid);
  }

  @media (max-width:768px){
    header{
      padding:16px;
    }

    .search-wrap {
      min-width: 240px;
      max-width: none;
      order: 3;
      flex-basis: 100%;
    }

    .subnav{
      padding:0 16px;
      gap:20px;
    }

    .feed{
      padding:28px 16px 80px;
    }

    .grid{
      grid-template-columns:repeat(auto-fill, minmax(150px, 1fr));
      gap:16px;
    }

    .feed-head{
      margin-bottom:24px;
    }

    footer{
      padding:28px 16px;
      font-size:11px;
    }
  }
</style>
</head>
<body>

<header>
  <a class="brand" href="/">
    <img src="/justlogo.png" alt="">
    <span>Alisilia</span>
  </a>
  
  <div class="search-wrap">
    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
    </svg>
    <input type="text" class="search-input" id="searchInput" placeholder="Search videos by title, #hashtag...">
    <div class="search-results" id="searchResults"></div>
  </div>

  <div class="auth" id="authArea">
    <div class="auth-skeleton"></div>
  </div>
</header>

<script>
  // Error watchdog: surfaces toast if script fails
  (function(){
    var authArea = document.getElementById('authArea');

    var toastStack = document.createElement('div');
    toastStack.className = 'toast-stack';
    document.body.appendChild(toastStack);

    window.toast = function(message, title){
      title = title || 'Something went wrong';
      var el = document.createElement('div');
      el.className = 'toast';
      el.innerHTML =
        '<div class="toast-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 8v5M12 16.2v .01"/></svg></div>' +
        '<div class="toast-body"><div class="toast-title"></div><div class="toast-msg"></div></div>' +
        '<button class="toast-close" aria-label="Dismiss">&times;</button>';
      el.querySelector('.toast-title').textContent = title;
      el.querySelector('.toast-msg').textContent = message;
      toastStack.appendChild(el);
      var timer;
      function dismiss(){ clearTimeout(timer); el.classList.add('leaving'); setTimeout(function(){ el.remove(); }, 180); }
      el.querySelector('.toast-close').addEventListener('click', dismiss);
      timer = setTimeout(dismiss, 8000);
      el.addEventListener('mouseenter', function(){ clearTimeout(timer); });
      el.addEventListener('mouseleave', function(){ timer = setTimeout(dismiss, 3000); });
    };

    window.addEventListener('error', function(e){
      var where = e.filename ? ' (' + e.filename.split('/').pop() + ':' + e.lineno + ')' : '';
      window.toast('A script failed to run: ' + (e.message || 'unknown error') + where, 'Page error');
    });
    window.addEventListener('unhandledrejection', function(e){
      var msg = (e.reason && e.reason.message) ? e.reason.message : String(e.reason);
      window.toast('A background request failed: ' + msg, 'Page error');
    });

    setTimeout(function(){
      var scriptNeverRan = typeof window.AlisiliaAuth === 'undefined';
      if (authArea && authArea.querySelector('.auth-skeleton') && scriptNeverRan) {
        window.toast(
          "The account system didn't finish loading in time. This usually means a script got blocked -- try disabling any ad/content blockers for this site, or test in a different browser.",
          'Still loading'
        );
        authArea.innerHTML = '<a href="/enter" class="btn btn-solid" style="color:#ffffff; text-decoration:none;">Enter</a>';
      }
    }, 6000);
  })();
</script>

<nav class="subnav" id="subnav">
  <!-- Populated at runtime from the list-categories edge function -->
</nav>

<section class="hero">
  <div class="hero-content">
    <h1 class="hero-text">The website that saved 80% of my time online.</h1>
    <p class="hero-subtitle">Find what you want, without distractions.</p>
  </div>
  
  <div class="watermark" aria-hidden="true">
    <img src="/justlogo.png" alt="">
    <img src="/justlogo.png" alt="">
    <img src="/justlogo.png" alt="">
  </div>
</section>

<section class="feed">
  <div class="feed-head">
    <h2>Your Content.</h2>
    <span class="feed-status"><span class="dot"></span>Scouring the Waves...</span>
  </div>

  <div class="grid" id="grid"></div>
</section>

<footer>
  Alisilia works alongside Social Media. Not affiliated with YouTube, Google, Meta, or any other Social Media used in Alisilia.
</footer>

<script>
  // ---------- Feed: skeletons while loading, then real classified/ranked videos ----------
  var grid = document.getElementById('grid');
  var feedStatus = document.querySelector('.feed-status');
  var subnav = document.getElementById('subnav');
  var searchInput = document.getElementById('searchInput');
  var searchResults = document.getElementById('searchResults');

  let CATEGORY_LABELS = {};
  let ALL_VIDEOS = []; // Store all videos for local search

  var skeletonCard = () => `
    <div class="card-sk">
      <div class="thumb-sk"></div>
      <div class="row-sk">
        <div class="avatar-sk"></div>
        <div class="lines-sk">
          <div class="line-sk w90"></div>
          <div class="line-sk w60"></div>
          <div class="line-sk w40"></div>
        </div>
      </div>
    </div>`;

  function renderSkeletons(){
    grid.innerHTML = Array.from({length:8}).map(skeletonCard).join('');
  }

  function escapeHtml(s){
    return (s || '').replace(/[&<>"']/g, function(c){
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }

  function formatLikes(n){
    n = n || 0;
    if (n >= 1000000) return (n/1000000).toFixed(1).replace(/\.0$/, '') + 'M';
    if (n >= 1000) return (n/1000).toFixed(1).replace(/\.0$/, '') + 'K';
    return String(n);
  }

  function renderVideoCard(v){
    var watchHref = '/watch/' + encodeURIComponent(v.video_id);
    var thumb = v.thumbnail_url || ('https://i.ytimg.com/vi/' + encodeURIComponent(v.video_id) + '/hqdefault.jpg');
    var avatar = v.creator && v.creator.channel_thumbnail ? v.creator.channel_thumbnail : '/justlogo.png';
    var channelName = (v.creator && v.creator.channel_title) || 'Unknown creator';
    var title = escapeHtml(v.title || 'Untitled');
    return (
      '<a class="vcard" href="' + watchHref + '">' +
        '<div class="vthumb-wrap"><img src="' + thumb + '" alt="" loading="lazy"></div>' +
        '<div class="vrow">' +
          '<img class="vavatar" src="' + avatar + '" alt="">' +
          '<div class="vmeta">' +
            '<div class="vtitle">' + title + '</div>' +
            '<div class="vchannel">' + escapeHtml(channelName) + '</div>' +
            '<div class="vsub">' + formatLikes(v.like_count) + ' likes</div>' +
          '</div>' +
        '</div>' +
      '</a>'
    );
  }

  // ---------- SEARCH FUNCTIONALITY ----------
  let currentSearchCategory = null;
  var activeHashtags = new Set();

  function normalizeSearchText(text) {
    return text.toLowerCase().trim();
  }

  function performSearch() {
    var query = normalizeSearchText(searchInput.value);
    
    if (!query && activeHashtags.size === 0) {
      searchResults.classList.remove('show');
      return;
    }

    let results = ALL_VIDEOS;

    // Filter by hashtags if any are active
    if (activeHashtags.size > 0) {
      results = results.filter(function(v) {
        var tags = (v.hashtags || []).map(function(t) { return t.toLowerCase(); });
        return Array.from(activeHashtags).every(function(tag) {
          return tags.includes(tag.toLowerCase());
        });
      });
    }

    // Filter by title if query exists
    if (query) {
      results = results.filter(function(v) {
        return normalizeSearchText(v.title || '').includes(query);
      });
    }

    renderSearchResults(results);
  }

  function renderSearchResults(results) {
    if (results.length === 0) {
      searchResults.innerHTML = '<div class="search-empty">No videos found matching your search.</div>';
      searchResults.classList.add('show');
      return;
    }

    var resultsHtml = results.slice(0, 8).map(function(v) {
      var thumb = v.thumbnail_url || ('https://i.ytimg.com/vi/' + encodeURIComponent(v.video_id) + '/hqdefault.jpg');
      var watchHref = '/watch/' + encodeURIComponent(v.video_id);
      var category = CATEGORY_LABELS[v.category] || v.category || 'uncategorized';
      return (
        '<a href="' + watchHref + '" class="search-result-item">' +
          '<img src="' + thumb + '" alt="" class="search-result-thumb" loading="lazy">' +
          '<div class="search-result-meta">' +
            '<div class="search-result-title">' + escapeHtml(v.title || 'Untitled') + '</div>' +
            '<div class="search-result-category">' + escapeHtml(category) + '</div>' +
          '</div>' +
        '</a>'
      );
    }).join('');

    var hashtags = extractAllHashtags(results);
    var hashtagsHtml = hashtags.length > 0 ? (
      '<div class="search-hashtags">' +
        hashtags.map(function(tag) {
          var isActive = activeHashtags.has(tag);
          return '<button class="search-hashtag-chip' + (isActive ? ' active' : '') + '" data-hashtag="' + escapeHtml(tag) + '">#' + escapeHtml(tag) + '</button>';
        }).join('') +
      '</div>'
    ) : '';

    searchResults.innerHTML = resultsHtml + hashtagsHtml;
    searchResults.classList.add('show');
  }

  function extractAllHashtags(videos) {
    var tagsSet = new Set();
    videos.forEach(function(v) {
      if (v.hashtags && Array.isArray(v.hashtags)) {
        v.hashtags.forEach(function(tag) {
          tagsSet.add(tag);
        });
      }
    });
    return Array.from(tagsSet).sort();
  }

  searchInput.addEventListener('input', function() {
    performSearch();
  });

  searchInput.addEventListener('focus', function() {
    if (searchInput.value || activeHashtags.size > 0) {
      performSearch();
    }
  });

  document.addEventListener('click', function(e) {
    if (e.target.classList.contains('search-hashtag-chip')) {
      e.preventDefault();
      var tag = e.target.getAttribute('data-hashtag');
      if (activeHashtags.has(tag)) {
        activeHashtags.delete(tag);
      } else {
        activeHashtags.add(tag);
      }
      performSearch();
      return;
    }

    // Close search results when clicking outside
    if (!searchInput.contains(e.target) && !searchResults.contains(e.target)) {
      searchResults.classList.remove('show');
    }
  });

  // ---------- Feed loading ----------
  let currentCategory = 'all';
  let requestToken = 0;

  function loadFeed(category){
    currentCategory = category;
    var myToken = ++requestToken;

    renderSkeletons();
    feedStatus.innerHTML = '<span class="dot"></span>Scouring the Waves...';

    AlisiliaAuth.getPublicFeed(category, 60)
      .then(function(data){
        if (myToken !== requestToken) return;
        var videos = (data && data.videos) || [];
        
        // Store for search
        ALL_VIDEOS = videos;

        if (videos.length === 0) {
          grid.innerHTML = '<div class="feed-empty">No videos here yet -- check back soon.</div>';
        } else {
          grid.innerHTML = videos.map(renderVideoCard).join('');
        }
        feedStatus.textContent = videos.length + (videos.length === 1 ? ' video' : ' videos');
      })
      .catch(function(err){
        if (myToken !== requestToken) return;
        grid.innerHTML = '<div class="feed-error">Could not load the feed right now.</div>';
        feedStatus.textContent = 'Failed to load';
        window.toast(err && err.message ? err.message : 'Could not load the feed.', 'Feed error');
      });
  }

  subnav.addEventListener('click', function(e){
    var link = e.target.closest('a[data-category]');
    if (!link) return;
    e.preventDefault();
    if (link.classList.contains('active')) return;
    subnav.querySelectorAll('a').forEach(function(a){ a.classList.remove('active'); });
    link.classList.add('active');
    loadFeed(link.getAttribute('data-category'));
  });

  function renderSubnav(categories){
    subnav.innerHTML = categories.map(function(c, i){
      return '<a href="#" class="' + (i === 0 ? 'active' : '') + '" data-category="' +
        escapeHtml(c.key) + '">' + escapeHtml(c.label) + '</a>';
    }).join('');
  }

  function loadCategories(){
    feedStatus.innerHTML = '<span class="dot"></span>Scouring the Waves...';
    renderSkeletons();

    AlisiliaAuth.getCategories()
      .then(function(data){
        var categories = (data && data.categories) || [];
        if (categories.length === 0) throw new Error('No categories returned.');

        categories.forEach(function(c){ CATEGORY_LABELS[c.key] = c.label; });
        if (CATEGORY_LABELS.all) CATEGORY_LABELS.all = "your feed, structured";

        renderSubnav(categories);
        loadFeed(categories[0].key);
      })
      .catch(function(err){
        subnav.innerHTML = '';
        grid.innerHTML = '<div class="feed-error">Could not load categories right now.</div>';
        feedStatus.textContent = 'Failed to load';
        window.toast(err && err.message ? err.message : 'Could not load categories.', 'Feed error');
      });
  }

  loadCategories();
</script>

<script>
  var authArea = document.getElementById('authArea');
  AlisiliaAuth.renderHeader(authArea);
  AlisiliaAuth.enforceFirstTimeGate();
  AlisiliaAuth.startAutoSync();
</script>

</body>
